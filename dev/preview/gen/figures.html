<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
<body><script type="module">
// Menu figurines: a sitting cat and a sitting dog modelled as matte glazed
// ceramic, rendered as a turntable strip (node gen/figures-run.js).
import * as T from 'three';

const mat = (c, rough = 0.55) => new T.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0 });
const put = (g, geo, m, [x, y, z], s = [1, 1, 1], r = [0, 0, 0]) => {
  const o = new T.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(...s); o.rotation.set(...r); g.add(o); return o;
};
const ball = (r) => new T.SphereGeometry(r, 64, 32);
const tube = (pts, r) => new T.TubeGeometry(new T.CatmullRomCurve3(pts.map((p) => new T.Vector3(...p))), 64, r, 20, false);

function cat(color) {
  const g = new T.Group(); const m = mat(color);
  put(g, ball(0.6), m, [0, 0.6, -0.08], [0.85, 1.0, 0.95]);
  for (const s of [-1, 1]) put(g, ball(0.36), m, [s * 0.3, 0.36, -0.12], [0.9, 1, 1.2]);
  put(g, ball(0.4), m, [0, 0.98, 0.1], [0.95, 1.15, 0.85]);
  for (const s of [-1, 1]) {
    put(g, new T.CapsuleGeometry(0.095, 0.62, 12, 24), m, [s * 0.15, 0.4, 0.3]);
    put(g, ball(0.12), m, [s * 0.15, 0.07, 0.36], [1, 0.6, 1.25]);
    put(g, new T.ConeGeometry(0.17, 0.32, 32), m, [s * 0.21, 1.9, 0.12], [1, 1, 0.6], [0, 0, -s * 0.28]);
  }
  put(g, ball(0.36), m, [0, 1.58, 0.16], [1.12, 0.95, 1]);
  put(g, ball(0.15), m, [0, 1.49, 0.44], [1.35, 0.8, 0.8]);
  put(g, tube([[0.25, 0.1, -0.5], [0.55, 0.08, -0.25], [0.62, 0.07, 0.1], [0.45, 0.07, 0.4]], 0.075), m, [0, 0, 0]);
  return g;
}

function dog(color) {
  const g = new T.Group(); const m = mat(color);
  put(g, ball(0.6), m, [0, 0.55, -0.18], [0.95, 0.9, 1.1]);
  put(g, ball(0.45), m, [0, 1.02, 0.14], [1, 1.2, 0.95]);
  for (const s of [-1, 1]) {
    put(g, new T.CapsuleGeometry(0.11, 0.72, 12, 24), m, [s * 0.2, 0.44, 0.34]);
    put(g, ball(0.13), m, [s * 0.2, 0.08, 0.42], [1, 0.6, 1.3]);
    put(g, ball(0.2), m, [s * 0.34, 1.56, 0.12], [0.42, 1.05, 0.8], [0, 0, s * 0.3]);
  }
  put(g, ball(0.34), m, [0, 1.68, 0.18]);
  put(g, new T.CapsuleGeometry(0.15, 0.22, 12, 24), m, [0, 1.56, 0.5], [1, 1, 0.9], [Math.PI / 2, 0, 0]);
  put(g, ball(0.065), mat('#3a2c22', 0.35), [0, 1.6, 0.74]);
  put(g, tube([[0, 0.28, -0.75], [0.25, 0.1, -0.85], [0.55, 0.06, -0.6]], 0.07), m, [0, 0, 0]);
  return g;
}

window.renderStrip = async ({ kind, color, size, frames }) => {
  const r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setSize(size, size); r.setPixelRatio(1); r.setClearColor(0x000000, 0);
  r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
  r.outputColorSpace = T.SRGBColorSpace; r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.25;
  const scene = new T.Scene();
  scene.add(new T.HemisphereLight('#fff6ea', '#8a6d52', 1.5));
  const key = new T.DirectionalLight('#fff1dd', 2.4); key.position.set(2.5, 5, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 8;
  Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -2 }); scene.add(key);
  const rim = new T.DirectionalLight('#ffe2c0', 1.2); rim.position.set(-3, 2.5, -3); scene.add(rim);
  const floor = new T.Mesh(new T.PlaneGeometry(10, 10), new T.ShadowMaterial({ opacity: 0.22 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const fig = kind === 'cat' ? cat(color) : dog(color);
  fig.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(fig);
  const cam = new T.PerspectiveCamera(23.5, 1, 0.1, 50); cam.position.set(0, 2.2, 5.6); cam.lookAt(0, 0.95, 0);
  const strip = document.createElement('canvas'); strip.width = size * frames; strip.height = size;
  const ctx = strip.getContext('2d');
  for (let i = 0; i < frames; i++) {
    fig.rotation.y = 0.55 + (i / frames) * Math.PI * 2;
    r.render(scene, cam);
    ctx.drawImage(r.domElement, i * size, 0);
  }
  return strip.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
